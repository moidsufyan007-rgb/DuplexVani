services:
  - type: web
    name: duplexvani
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
      - key: DEFAULT_LANGUAGE
        value: hi-IN
      - key: PROJECT_NAME
        value: DuplexVani
    healthCheckPath: /api/health
